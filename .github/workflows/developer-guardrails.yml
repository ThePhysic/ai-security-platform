name: Controlled AppSec artifact and policy demonstration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Build pinned trusted toolchain (no target scripts)
        run: docker build --target tests --tag asp-phase5/guardrails:local .
      - name: Generate offline fixture JSON and SARIF without credentials or network
        id: generate
        run: |
          docker create --name asp-phase5-artifacts --network none --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 64 --memory 512m --cpus 1 --tmpfs /tmp:rw,nosuid,nodev,size=128m asp-phase5/guardrails:local /app/.venv/bin/python -c "import time; time.sleep(300)"
          docker start asp-phase5-artifacts
          docker exec asp-phase5-artifacts /app/.venv/bin/python /app/scripts/generate_ci_artifacts.py
          mkdir artifacts
          for filename in guardrails.json guardrails.sarif policy.json; do
            docker exec asp-phase5-artifacts /app/.venv/bin/python -c "import pathlib,sys; b=(pathlib.Path('/tmp/guardrails/.local/reports')/sys.argv[1]).read_bytes(); assert len(b)<=4194304; sys.stdout.buffer.write(b)" "$filename" > "artifacts/$filename"
          done
      - name: Verify complete artifacts and expected demonstration policy failure 1
        id: verify
        if: success() && steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/verify_ci_artifacts.py --send |
            docker exec -i asp-phase5-artifacts /app/.venv/bin/python /app/scripts/verify_ci_artifacts.py --stdin
      - name: Preserve artifact-only fallback (no code-scanning upload)
        if: success() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-appsec-reports
          path: |
            artifacts/guardrails.json
            artifacts/guardrails.sarif
            artifacts/policy.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Remove only this disposable workflow container
        if: always()
        run: |
          if docker container inspect asp-phase5-artifacts >/dev/null 2>&1; then
            docker rm --force asp-phase5-artifacts
          fi
