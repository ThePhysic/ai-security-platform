name: asp-phase1

x-db-image: &db-image postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27

services:
  db:
    image: *db-image
    environment:
      POSTGRES_DB: asp_dev
      POSTGRES_USER: asp_owner
      POSTGRES_PASSWORD: ${ASP_DB_PASSWORD:?Generate ignored local credentials first}
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp_owner -d asp_dev"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: .
      target: runtime
    environment:
      ASP_DATABASE_URL: postgresql+psycopg://asp_owner:${ASP_DB_PASSWORD:?Required}@db:5432/asp_dev
      ASP_API_TOKEN: ${ASP_API_TOKEN:?Required}
      ASP_SNAPSHOT_SPOOL: /spool
      ASP_LAUNCHER_TOKEN: ${ASP_LAUNCHER_TOKEN:-}
      ASP_REAL_SCANNING_ENABLED: ${ASP_REAL_SCANNING_ENABLED:-false}
      ASP_ALLOWED_HOSTS: '["127.0.0.1:${ASP_API_PORT:-18081}","localhost:${ASP_API_PORT:-18081}","127.0.0.1:8000","localhost:8000"]'
      ASP_ALLOWED_ORIGINS: '["http://127.0.0.1:${ASP_API_PORT:-18081}","http://localhost:${ASP_API_PORT:-18081}"]'
    ports:
      - "127.0.0.1:${ASP_API_PORT:-18081}:8000"
    volumes: &snapshot-reader-mount
      - type: bind
        source: ./.local/snapshot-spool
        target: /spool
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 3s
      timeout: 4s
      retries: 20
  worker:
    profiles: [workers]
    build:
      context: .
      target: runtime
    command: ["uv", "run", "--no-sync", "python", "-m", "ai_security_platform.jobs.worker"]
    environment:
      ASP_DATABASE_URL: postgresql+psycopg://asp_owner:${ASP_DB_PASSWORD:?Required}@db:5432/asp_dev
      ASP_API_TOKEN: ${ASP_API_TOKEN:?Required}
      ASP_SNAPSHOT_SPOOL: /spool
      ASP_REAL_SCANNING_ENABLED: ${ASP_REAL_SCANNING_ENABLED:-false}
    volumes: *snapshot-reader-mount
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  test-db:
    profiles: [test]
    image: *db-image
    environment:
      POSTGRES_DB: asp_phase1_test
      POSTGRES_USER: asp_test
      POSTGRES_PASSWORD: ${ASP_TEST_DB_PASSWORD:?Required}
    volumes:
      - test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp_test -d asp_phase1_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://asp_test:${ASP_TEST_DB_PASSWORD:?Required}@test-db:5432/asp_phase1_test
      ASP_DISPOSABLE_TEST_DB: asp_phase1_test
    depends_on:
      test-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  dev-db:
  test-db:
