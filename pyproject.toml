[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ai-security-platform"
version = "0.1.0"
description = "Local security engineering and developer guardrails foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
]

[project.scripts]
asp = "ai_security_platform.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evaluation/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ai_security_platform", "runner", "scripts"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -p no:cacheprovider"
markers = [
  "reliability: real PostgreSQL workload and developer workflow recovery",
  "evaluation: frozen labelled corpus and expanded adversarial assessment",
  "agent: bounded triage, consent, confidentiality and human review",
  "snapshot: secure local source and spool boundaries",
  "orchestration: real PostgreSQL concurrency, fencing and recovery",
  "unit: configuration, contracts and infrastructure policy",
  "api: isolated HTTP contracts without a live database",
  "postgres: real disposable PostgreSQL migrations and persistence",
]

# Pin and authenticate the isolated build toolchain separately from runtime packages.
[tool.uv]
build-constraint-dependencies = [
  { requirement = "hatchling==1.32.4", hashes = ["sha256:08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c"] },
  { requirement = "packaging==26.3", hashes = ["sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
  { requirement = "pathspec==1.1.1", hashes = ["sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
  { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec"] },
  { requirement = "tomlkit==0.15.2", hashes = ["sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437"] },
  { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
]
