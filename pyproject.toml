[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-security-platform"
version = "0.1.0"
description = "Local security engineering and developer guardrails foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
]

[project.scripts]
asp = "ai_security_platform.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "PyYAML>=6,<7",
  "types-PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evaluation/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ai_security_platform", "runner", "scripts"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -p no:cacheprovider"
markers = [
  "reliability: real PostgreSQL workload and developer workflow recovery",
  "evaluation: frozen labelled corpus and expanded adversarial assessment",
  "agent: bounded triage, consent, confidentiality and human review",
  "snapshot: secure local source and spool boundaries",
  "orchestration: real PostgreSQL concurrency, fencing and recovery",
  "unit: configuration, contracts and infrastructure policy",
  "api: isolated HTTP contracts without a live database",
  "postgres: real disposable PostgreSQL migrations and persistence",
]
